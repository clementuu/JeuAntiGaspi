<!DOCTYPE html>
<html lang="fr" onclick="toGame()">
	<head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Le jeu Anti-Gaspi</title>
		<link rel="stylesheet" href="style/style.css">
        <script src="data/interaction.js" defer></script>
		<script src="data/collisions.js" defer></script>
		<script src="scripts/classes.js" defer></script>
        <script src="scripts/controls.js" defer></script>
	</head>
	
	<body id="controls">
        <div id="background"></div>
        <main id="start-page">
            <div class="flex-col">
                <h4 id="rule">Vous devez finir vos tâches avant la fin du temps imparti pour rejoindre vos amis au parc !</h4>
                <div id="text-controls">
                    <h2>Commandes :</h2>
                    <ol>
                        <li>&uarr; : Haut</li>
                        <li>&darr; : Bas</li>
                        <li>&larr; : Gauche</li>
                        <li>&rarr; : Droite</li>
                        <li>A : Interagir / Oui</li>
                        <li>Z : Retour / Non</li>
                        <li>Les éléments de l'inventaire sont cliquables !</li>
                    </ol>
                </div> 
                <p class="blink">Cliquez n'importe où pour jouer !</p>
            </div>
        </main>
	</body>
</html>
